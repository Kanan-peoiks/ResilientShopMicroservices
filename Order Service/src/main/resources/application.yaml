server:
  port: 8080

services:
  payment:
    url: http://localhost:8081
  inventory:
    url: http://localhost:8082

spring:
  application:
    name: order-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
      payment:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

  retry:
    instances:
      inventory:
        max-attempts: 3
        wait-duration: 500ms